name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Batch pipeline smoke test
        run: python -m finsight_aml.pipeline --customers 40 --transactions 1200 --output /tmp/finsight-sample
      - name: Streaming pipeline smoke test
        run: python -m finsight_aml.pipeline --stream --customers 40 --transactions 2500 --batch-size 400 --output /tmp/finsight-stream-sample
      - name: Verify completed checkpoint
        run: python -c "import json; s=json.load(open('/tmp/finsight-stream-sample/checkpoint.json')); assert s['status']=='completed' and s['last_transaction']==2500"
